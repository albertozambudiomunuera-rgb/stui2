<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUIapp — Sonda de persistencia IndexedDB</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --mut:#94a3b8;
          --ok:#22c55e; --warn:#eab308; --bad:#ef4444; --acc:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui,-apple-system,sans-serif; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border-radius:10px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:var(--acc);
             text-transform:uppercase; letter-spacing:.5px; }
  .row { display:flex; justify-content:space-between; gap:12px;
         padding:6px 0; border-bottom:1px solid #33415580; font-size:14px; }
  .row:last-child { border-bottom:0; }
  .row span:first-child { color:var(--mut); }
  .row span:last-child { text-align:right; font-variant-numeric:tabular-nums;
                         word-break:break-word; }
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  button { width:100%; padding:13px; margin-top:8px; border:0; border-radius:8px;
           background:var(--acc); color:#04293a; font-size:15px; font-weight:600;
           cursor:pointer; }
  button.sec { background:#334155; color:var(--fg); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  pre { background:#0b1220; padding:10px; border-radius:6px; font-size:11px;
        overflow-x:auto; max-height:260px; color:var(--mut); }
  .big { font-size:30px; font-weight:700; text-align:center; padding:10px 0; }
</style>
</head>
<body>

<h1>Sonda de persistencia IndexedDB</h1>
<div class="sub">STUIapp · instrumento de investigación · no recoge datos clínicos</div>

<div class="card">
  <h2>Canario</h2>
  <div id="canary"></div>
  <div class="big" id="survival">—</div>
</div>

<div class="card">
  <h2>Dispositivo</h2>
  <div id="env"></div>
</div>

<div class="card">
  <h2>Almacenamiento</h2>
  <div id="storage"></div>
</div>

<div class="card">
  <h2>Integridad</h2>
  <div id="integrity"></div>
</div>

<button id="refresh">Actualizar lecturas</button>
<button id="persist" class="sec">Solicitar almacenamiento persistente</button>
<button id="export" class="sec">Exportar resultados (JSON)</button>
<button id="reset" class="sec">Reiniciar canario</button>

<div class="card" style="margin-top:12px">
  <h2>Registro</h2>
  <pre id="log"></pre>
</div>

<script src="/persistence-probe.js"></script>
</body>
</html>
